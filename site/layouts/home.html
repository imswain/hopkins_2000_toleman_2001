{{ define "main" }}
<form>
	<label for="captcha">
		{{ with resources.Get "images/captchas/placeholder.png" }}
		<img src="{{ .RelPermalink }}" />
		{{ end }}
	</label>
	<div class="submit-container">
		<input type="text" id="captcha" required/>
		<button id="submit">Submit</button>
	</div>
	<noscript>
		JavaScript must be enabled for this page to function as intended.
	</noscript>
</form>
{{ end }}
