{{ define "main" }}
{{ partial "nav.html" . }}
	<div class="poem">
	{{ range .Params.pages }}
		<div class="page">
			{{ with resources.Get .src }}
				<img src="{{ .RelPermalink }}">
			{{ end }}
			{{ range .map }}
				<a href={{ .href }} style="top:{{.y}}; left:{{.x}}; width:{{.width}}; height:{{.height}};"></a>
			{{ end }}
		</div>
	{{ end }}
	</div>
{{ end }}
