{{ define "main" }}
{{ partial "nav.html" . }}
	<div class="poem">
	{{ range .Params.pages }}
		<div class="page">
			<img src="{{ .src }}">
			{{ range .map }}
				<a href={{ .href }} style="top:{{.y}}; left:{{.x}}; width:{{.width}}; height:{{.height}};"></a>
			{{ end }}
		</div>
	{{ end }}
	</div>
{{ end }}
