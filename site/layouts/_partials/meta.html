<meta charset="UTF-8">
<title>{{ .Page.Title }}</title>
{{ $style := resources.Get "styles.css" | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $style.Permalink }}">
{{ $poems := relURL "/poems" }}
{{ $opts := dict "params" (dict "poemURL" $poems) }}
{{ $script := resources.Get "script.js" | js.Build $opts }}
<script defer src="{{ $script.Permalink }}"></script>
